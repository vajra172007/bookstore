<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <div class="card form-card" style="max-width:600px;">
      <h1>Admin: Add Book</h1>
      <p class="muted">Simple demo page. No admin login is required.</p>
      <div id="message" class="message"></div>

      <form id="bookForm">
        <label for="title">Title</label>
        <input type="text" id="title" required>

        <label for="author">Author</label>
        <input type="text" id="author" required>

        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" required>

        <label for="price">Price (₹)</label>
        <input type="number" id="price" min="0" step="0.01" required>

        <label for="category">Category</label>
        <input type="text" id="category" placeholder="e.g. Fiction, Technology" required>

        <label for="stock">Stock</label>
        <input type="number" id="stock" min="0" step="1" required>

        <label for="image">Image URL (optional)</label>
        <input type="text" id="image" placeholder="https://...">

        <label for="description">Description</label>
        <textarea id="description"></textarea>

        <button type="submit" class="btn btn-full">Add Book</button>
      </form>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
